version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8040:8040"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8040 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "3040:3040"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8040
    depends_on:
      - backend
    command: npm run dev

volumes:
  backend_data:
