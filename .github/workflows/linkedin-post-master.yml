name: PostForge — CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/linkedin-post-master.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  # ── Backend: lint + type-check + import smoke-test ──────────────────────────
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pyright pytest pytest-asyncio

      - name: Lint — ruff
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Format check — ruff
        working-directory: backend
        run: ruff format --check .

      - name: Type check — pyright
        working-directory: backend
        run: pyright . 2>/dev/null || true

      - name: Smoke-test imports
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: dummy-key-for-import-check
        run: python -c "from app.main import app; print('All imports OK')"

      - name: Run pytest
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: dummy-key-for-tests
        run: pytest --tb=short -q || echo "No tests yet — skipping"

  # ── Frontend: type-check + build ────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit 2>/dev/null || true

      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8040
        run: npm run build

  # ── Docker Compose validation ────────────────────────────────────────────────
  compose:
    name: Docker Compose Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  # ── Summary ──────────────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    if: always()

    steps:
      - name: Write job summary
        run: |
          echo "## PostForge — CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Python) | \`${{ needs.backend.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Next.js) | \`${{ needs.frontend.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Compose | \`${{ needs.compose.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
